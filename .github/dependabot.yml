version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Caracas
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Las dependencias de desarrollo se agrupan en un solo PR semanal.
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion-menores:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
